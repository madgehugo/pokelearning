name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # mGBA embeds Lua 5.4, so test against the same version
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # the Lua suite calls `lua`; Ubuntu installs it as lua5.4
          LUA_BIN: lua5.4
